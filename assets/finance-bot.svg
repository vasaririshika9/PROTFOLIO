  <text x='205' y='75' fill='#94a3b8' font-family='sans-serif' font-size='11'>Total Balance</text>
  <text x='205' y='102' fill='#38bdf8' font-family='sans-serif' font-size='20' font-weight='bold'>,850.00</text>
  <text x='330' y='75' fill='#10b981' font-family='sans-serif' font-size='11'>+12.4%</text>

  <rect x='390' y='55' width='185' height='75' rx='10' fill='url(#cardBg)' stroke='#334155' stroke-width='1'/>
