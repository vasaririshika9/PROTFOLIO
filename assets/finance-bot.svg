  <text x='405' y='102' fill='#f43f5e' font-family='sans-serif' font-size='20' font-weight='bold'>,420.50</text>

  <rect x='590' y='55' width='195' height='75' rx='10' fill='url(#cardBg)' stroke='#334155' stroke-width='1'/>
