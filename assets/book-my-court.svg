<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 450' width='800' height='450'>
  <defs>
    <linearGradient id='bg2' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#064e3b'/>
      <stop offset='100%' stop-color='#0f172a'/>
    </linearGradient>
    <linearGradient id='accent2' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#10b981'/>
      <stop offset='100%' stop-color='#059669'/>
    </linearGradient>
    <linearGradient id='cardBg2' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#111827'/>
      <stop offset='100%' stop-color='#1f2937'/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width='800' height='450' rx='16' fill='url(#bg2)'/>

  <!-- Header Bar -->
  <rect width='800' height='40' fill='#022c22' rx='16'/>
  <rect y='30' width='800' height='10' fill='#022c22'/>
  <circle cx='24' cy='20' r='6' fill='#ef4444'/>
  <circle cx='44' cy='20' r='6' fill='#f59e0b'/>
  <circle cx='64' cy='20' r='6' fill='#10b981'/>
  <text x='400' y='25' fill='#a7f3d0' font-family='sans-serif' font-size='13' text-anchor='middle' font-weight='500'>Book My Court — Sports Facility Reservation System</text>

  <!-- Search & Filter Header -->
  <rect x='20' y='55' width='760' height='50' rx='10' fill='url(#cardBg2)' stroke='#047857' stroke-width='1'/>
  <text x='40' y='85' fill='#10b981' font-family='sans-serif' font-size='14' font-weight='bold'>🏸 Book My Court</text>
  
  <rect x='200' y='65' width='140' height='30' rx='6' fill='#374151'/>
  <text x='215' y='85' fill='#9ca3af' font-family='sans-serif' font-size='11'>Badminton Courts</text>
  
  <rect x='355' y='65' width='120' height='30' rx='6' fill='#374151'/>
  <text x='370' y='85' fill='#9ca3af' font-family='sans-serif' font-size='11'>Today, 6:00 PM</text>

  <rect x='640' y='65' width='120' height='30' rx='6' fill='url(#accent2)'/>
  <text x='665' y='85' fill='#ffffff' font-family='sans-serif' font-size='12' font-weight='bold'>Search Slots</text>

  <!-- Court Card 1 -->
  <rect x='20' y='120' width='235' height='300' rx='12' fill='url(#cardBg2)' stroke='#374151' stroke-width='1'/>
  <rect x='30' y='130' width='215' height='120' rx='8' fill='#065f46'/>
  <text x='137' y='195' fill='#ecfdf5' font-family='sans-serif' font-size='15' text-anchor='middle' font-weight='bold'>Turf A - Premium Indoor</text>
  <text x='35' y='270' fill='#f9fafc' font-family='sans-serif' font-size='14' font-weight='bold'>Court 1 (Wooden Flooring)</text>
  <text x='35' y='290' fill='#9ca3af' font-family='sans-serif' font-size='11'>Location: MLR Sports Complex</text>
  <text x='35' y='310' fill='#34d399' font-family='sans-serif' font-size='13' font-weight='bold'> / hour</text>

  <rect x='35' y='370' width='205' height='35' rx='6' fill='url(#accent2)'/>
  <text x='137' y='392' fill='#ffffff' font-family='sans-serif' font-size='12' text-anchor='middle' font-weight='bold'>Reserve Court</text>

  <!-- Court Card 2 -->
  <rect x='270' y='120' width='235' height='300' rx='12' fill='url(#cardBg2)' stroke='#374151' stroke-width='1'/>
  <rect x='280' y='130' width='215' height='120' rx='8' fill='#1e3a8a'/>
  <text x='387' y='195' fill='#dbeafe' font-family='sans-serif' font-size='15' text-anchor='middle' font-weight='bold'>Synthetic Tennis Court</text>
  <text x='285' y='270' fill='#f9fafc' font-family='sans-serif' font-size='14' font-weight='bold'>Court 2 (Floodlights)</text>
  <text x='285' y='290' fill='#9ca3af' font-family='sans-serif' font-size='11'>Location: Stadium Zone B</text>
  <text x='285' y='310' fill='#60a5fa' font-family='sans-serif' font-size='13' font-weight='bold'> / hour</text>

  <rect x='285' y='370' width='205' height='35' rx='6' fill='#2563eb'/>
  <text x='387' y='392' fill='#ffffff' font-family='sans-serif' font-size='12' text-anchor='middle' font-weight='bold'>Reserve Court</text>

  <!-- Court Card 3 -->
  <rect x='520' y='120' width='260' height='300' rx='12' fill='url(#cardBg2)' stroke='#374151' stroke-width='1'/>
  <rect x='530' y='130' width='240' height='120' rx='8' fill='#854d0e'/>
  <text x='650' y='195' fill='#fef08a' font-family='sans-serif' font-size='15' text-anchor='middle' font-weight='bold'>Basketball Arena</text>
  <text x='535' y='270' fill='#f9fafc' font-family='sans-serif' font-size='14' font-weight='bold'>Full Court 3</text>
  <text x='535' y='290' fill='#9ca3af' font-family='sans-serif' font-size='11'>Location: Central Arena</text>
  <text x='535' y='310' fill='#facc15' font-family='sans-serif' font-size='13' font-weight='bold'> / hour</text>

  <rect x='535' y='370' width='230' height='35' rx='6' fill='#ca8a04'/>
  <text x='650' y='392' fill='#ffffff' font-family='sans-serif' font-size='12' text-anchor='middle' font-weight='bold'>Reserve Court</text>
</svg>